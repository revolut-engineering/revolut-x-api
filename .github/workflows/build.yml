name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: modules-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - name: Install all dependencies
        if: steps.modules-cache.outputs.cache-hit != 'true'
        run: npm ci

  build-api:
    name: Build API
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: api-dist-cache
        with:
          path: api/dist
          key: api-dist-${{ runner.os }}-${{ hashFiles('api/package.json', 'api/tsconfig.json', 'api/src/**') }}

      - run: npm run build
        if: steps.api-dist-cache.outputs.cache-hit != 'true'

  lint:
    name: Lint & Format
    needs: [install, build-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: api/dist
          key: api-dist-${{ runner.os }}-${{ hashFiles('api/package.json', 'api/tsconfig.json', 'api/src/**') }}
          restore-keys: api-dist-${{ runner.os }}-

      - run: npm run format:check

      - run: npm run lint

      - run: npm run sync-skills:check

      - run: npm run api-range:check

      - name: Check package licenses
        run: cmp LICENSE api/LICENSE && cmp LICENSE cli/LICENSE

  test-api:
    name: Test API (Node ${{ matrix.node }})
    strategy:
      matrix:
        node: [20, 22]
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - run: npm run typecheck

      - run: npm test

  test-mcp:
    name: Test MCP (Node ${{ matrix.node }})
    strategy:
      matrix:
        node: [20, 22]
    needs: [install, build-api]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: api/dist
          key: api-dist-${{ runner.os }}-${{ hashFiles('api/package.json', 'api/tsconfig.json', 'api/src/**') }}
          restore-keys: api-dist-${{ runner.os }}-

      - run: npm run typecheck

      - run: npm test

  test-cli:
    name: Test CLI (Node ${{ matrix.node }})
    strategy:
      matrix:
        node: [20, 22]
    needs: build-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: api/dist
          key: api-dist-${{ runner.os }}-${{ hashFiles('api/package.json', 'api/tsconfig.json', 'api/src/**') }}
          restore-keys: api-dist-${{ runner.os }}-

      - run: npm run typecheck

      - run: npm test

  pack-api:
    name: Pack API
    needs: [build-api, test-api]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: api/dist
          key: api-dist-${{ runner.os }}-${{ hashFiles('api/package.json', 'api/tsconfig.json', 'api/src/**') }}
          restore-keys: api-dist-${{ runner.os }}-

      - run: npm pack

      - name: Check the license is packed
        run: tar -tzf *.tgz | grep -qx package/LICENSE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: revolut-x-api-tgz
          path: api/*.tgz
          if-no-files-found: error

  pack-cli:
    name: Pack CLI
    needs: test-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: api/dist
          key: api-dist-${{ runner.os }}-${{ hashFiles('api/package.json', 'api/tsconfig.json', 'api/src/**') }}
          restore-keys: api-dist-${{ runner.os }}-

      - name: Build CLI
        run: cd cli && npm run build

      - name: Pack tarball
        run: cd cli && npm pack

      - name: Check the license is packed
        run: cd cli && tar -tzf *.tgz | grep -qx package/LICENSE

      - name: Install the packed CLI like a client
        run: npm run pack:check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: revolut-x-cli-tgz
          path: cli/*.tgz
          if-no-files-found: error

  pack-mcp:
    name: Pack MCP
    needs: test-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: api/dist
          key: api-dist-${{ runner.os }}-${{ hashFiles('api/package.json', 'api/tsconfig.json', 'api/src/**') }}
          restore-keys: api-dist-${{ runner.os }}-

      - name: Build MCPB archive
        run: bash scripts/build-mcpb.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: revolutx-mcp-mcpb
          path: mcp/dist/revolutx-mcp.mcpb
          if-no-files-found: error

  sbom:
    name: Generate SBOM
    needs: [pack-api, pack-cli, pack-mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-v2-${{ hashFiles('package-lock.json') }}

      - name: Generate SBOMs
        run: |
          npx @cyclonedx/cyclonedx-npm --package-lock-only --workspace '@revolut/revolut-x-api' --output-file sbom-api.json
          npx @cyclonedx/cyclonedx-npm --package-lock-only --workspace '@revolut/revolut-x-cli' --output-file sbom-cli.json
          npx @cyclonedx/cyclonedx-npm --package-lock-only --workspace revolutx-mcp --output-file sbom-mcp.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom-*.json
          if-no-files-found: error
